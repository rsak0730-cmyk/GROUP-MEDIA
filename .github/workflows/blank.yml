name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Djava.awt.headless=true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Workspace & Extract
        run: |
          # 1. Unzip project archive
          find . -maxdepth 2 -type f -name "*.zip" -exec unzip -o {} \;

          # 2. Relocate nested files to root if needed
          TARGET_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            cp -rn "$TARGET_DIR"/* . || true
          fi

          # 3. Create required configs and debug keystore
          touch .env
          mkdir -p ~/.android
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp ./debug.keystore ~/.android/debug.keystore || true
          cp ./debug.keystore ./app/debug.keystore 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon -x test -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundSync-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
