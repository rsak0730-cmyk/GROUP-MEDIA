name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Workspace & Extract Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          SUBDIR=$(find . -mindepth 2 -maxdepth 3 -name "build.gradle.kts" -not -path "./app/*" -exec dirname {} \; | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -rn "$SUBDIR"/* . || true
          fi
          touch .env
          mkdir -p ~/.android
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ./debug.keystore ~/.android/debug.keystore || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundSync-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
